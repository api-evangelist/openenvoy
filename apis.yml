aid: openenvoy
name: OpenEnvoy
description: 'OpenEnvoy is an AI-native financial operations platform for enterprise and mid-market
  finance teams, automating accounts payable, accounts receivable, invoice processing and cash
  application end to end. The platform ingests invoices from any format, extracts and GL-codes the
  data without OCR templates, and reconciles each invoice against purchase orders, contracts, rate
  sheets and receipts to catch duplicates, fraud and supplier overbilling before payment. OpenEnvoy
  publishes a public RESTful API covering job (invoice) creation, document upload, matching status
  and user/role administration, documented as a public Postman collection at apidocs.openenvoy.io
  with a Swagger 2.0 definition served from the API host itself. It integrates with SAP, Oracle,
  NetSuite, Microsoft Dynamics and QuickBooks Online.'
