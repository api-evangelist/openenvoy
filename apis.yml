apis:
- aid: openenvoy-api
  name: OpenEnvoy API
  description: 'The OpenEnvoy public REST API. Jobs are the core object: a job is an invoice under
    audit, created by uploading a provider invoice, optionally supplemented with baseline documents
    (purchase orders, contracts, rate sheets, receipts), then completed so OpenEnvoy can run its
    matching engine and return line-item level matched amounts. The v1 surface covers job creation,
    document upload and versioning, job retrieval, and user/role administration; the v2 surface adds
    job search, status changes, approval, rematch and delete. Authentication is a per-customer
    client id plus a bearer token issued by OpenEnvoy customer success.'
  humanURL: https://apidocs.openenvoy.io/
  baseURL: https://backend.openenvoy.io/public/api/v1
