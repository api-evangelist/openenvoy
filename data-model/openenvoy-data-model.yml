summary: >-
  A job-centric graph. A Job is one invoice under audit. It owns many JobDocuments (the invoice plus
  its baseline documents — purchase orders, contracts, rate sheets, receipts), each of which owns
  many JobDocumentVersions. The matching result is attached at the version level as
  MatchingLineItems, which pair each invoice line against the matched baseline line. Extracted
  invoice content hangs off the Job as InvoiceInfo.
identifiers:
  style: uuid-v4
  note: >-
    All entity ids are UUIDs. Job additionally carries a human-facing `job_number` (example
    "OE0001") which is the identifier every job-scoped path uses — paths are /jobs/{jobNumber},
    not /jobs/{id}. An agent must not substitute Job.id for jobNumber.
  prefixes: []
entities:
- name: Job
  description: An invoice under audit, and the root of the graph.
  primary_key: id (uuid)
  business_key: job_number
  fields:
  - {name: id, type: string, format: uuid}
  - {name: job_number, type: string, note: human-facing key used in all job-scoped paths}
  - {name: status, type: string, note: 'e.g. Matching. The full status enumeration is not published.'}
  - {name: active, type: boolean, note: suggests soft-delete semantics}
  - {name: amount, type: integer}
  - {name: matched_amount, type: integer}
  - {name: matched_amount_status, type: string}
  - {name: note, type: string}
  - {name: provider, type: object, note: 'the supplier/vendor; inline object, not a $ref'}
  - {name: created_at, type: string, format: date-time}
  - {name: updated_at, type: string, format: date-time}
  operations:
