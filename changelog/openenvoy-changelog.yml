- date: '2026-08-24'
  title: AI Matching Summary on Job Details
  category: Accounts Payable
  breaking: false
  highlights:
  - Generate a plain-language Matching Summary explaining what is blocking a job and how to clear it.
  - Summary is stamped with a generated-at time and persists inline; regenerable as data changes.
  - '"Ask OE" link opens the Job Agent primed with that job''s matching context.'
- date: '2026-08-18'
  version: v141.0.0
  title: Release Notes - v141.0.0
  category: Accounts Payable
  breaking: false
  highlights:
  - Resizable, per-user-persisted table columns across jobs, documents, orders, payments, expenses.
  - Persistent table sort on Inbox, Documents & Sources and Home job list.
  - Bulk actions on completed jobs, including bulk re-open and bulk re-submit of failed-sync jobs.
  - Link supporting documents to a job after matching and sync.
  - Live auto-refreshing job details while a job is in matching status.
  - Unsupported spend added as a job-list column and filter.
