domain_standard:
  market: accounts payable / e-invoicing / procure-to-pay
  candidates_probed:
  - id: peppol
    conforms: unknown
    evidence: >-
      No PEPPOL participant identifier, BIS Billing 3.0 shape, UBL or AS4 surface appears anywhere
      in the published contract. OpenEnvoy markets e-invoicing with "global compliance standards"
      but names no standard on any page reachable to us.
  - id: ubl
    conforms: false
    evidence: >-
      The InvoiceInfo/LineItems schemas are a bespoke flat model (number, date, due_date,
      payment_terms, amount_due, currency, seller, buyer, line_items) with no UBL element names,
      namespaces or cbc/cac prefixes.
  - id: 'edifact-invoic'
    conforms: false
    evidence: No EDIFACT message type or segment structure in the contract.
  - id: 'x12-810'
    conforms: false
    evidence: >-
      No X12 810 (Invoice) or 850 (Purchase Order) transaction-set shape in the contract, despite
      the product ingesting EDI per its own platform page.
  - id: 'iso-20022'
    conforms: false
    evidence: No ISO 20022 message identifiers in the payment_information object.
  - id: 'factur-x / zugferd'
    conforms: false
    evidence: No hybrid PDF/XML profile declared on the document ingest endpoints.
  result: none-declared
  note: >-
    REWARD-ONLY dimension, and OpenEnvoy earns nothing here — not because its market lacks a
    standard, but because it has one (PEPPOL/UBL for e-invoicing, X12/EDIFACT for procure-to-pay)
    and the contract declares none of it. The API accepts an invoice as an opaque uploaded FILE and
    returns a proprietary extracted model, so a buyer who already speaks UBL or X12 gets no
    standards-native path and needs a bespoke connector. This is a genuine, specific gap rather
    than an absent-market exemption.
compliance_claims:
- claim: SOX and GDPR compliance, encrypted storage, access controls, audit logs
