    Claim is taken from OpenEnvoy's own llms.txt description of its security page. The security page
    itself returned HTTP 403 to our crawler (Cloudflare bot challenge), so the claim could not be
    read at source and no certification (SOC 2, ISO 27001) was evidenced. Not scored as Compliance.
- claim: multi-currency and global e-invoicing compliance standards
  source: https://www.openenvoy.com/llms.txt
  verified: false
  note: No standard is named. Multi-currency IS evidenced in the contract (MatchingLineItems carries invoice_currency, matched_currency and exchange_rate).
