method: derived
source: openapi/openenvoy-openapi.json + postman/openenvoy-postman-collection.json + https://www.openenvoy.com/llms.txt
note: >-
  Assessed against the published contract, not against marketing claims. OpenEnvoy's llms.txt states
  the platform supports "global compliance standards" for e-invoicing and complies with SOX and
  GDPR, but the security page that would evidence this is behind a Cloudflare bot challenge for our
  crawler and no trust center or certification listing was reachable, so no Compliance pointer is
  emitted.
standards:
- id: openapi
  conforms: false
  evidence: >-
    The provider publishes Swagger 2.0 (openapi/openenvoy-openapi.json, `swagger: "2.0"`), not
    OpenAPI 3.x. It is a valid machine-readable contract but predates OpenAPI 3.0 (2017).
- id: oauth2
  conforms: false
  evidence: No oauth2 securityDefinition; authentication is a static client id plus bearer token.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returned 404 on every host.
- id: rfc9457
  conforms: false
  evidence: >-
    Errors return application/json with proprietary keys (errorCode/errorMessage/key), not
    application/problem+json. See errors/openenvoy-problem-types.yml.
- id: rfc8594
  conforms: false
  evidence: No Sunset or Deprecation headers documented or observed.
- id: rfc9116
  conforms: false
  evidence: /.well-known/security.txt returned 404 on all six hosts.
- id: idempotency
  conforms: false
  evidence: No Idempotency-Key or equivalent replay-protection mechanism in the contract or docs.
- id: pagination
  conforms: false
  evidence: No limit/offset/cursor parameters on any collection operation.
- id: 'json:api'
  conforms: false
  evidence: Plain JSON resource representations; no JSON:API document structure.
- id: rate-limit-headers
  conforms: false
  evidence: No RateLimit-* or X-RateLimit-* headers documented or observed.
- id: https-only
  conforms: false
